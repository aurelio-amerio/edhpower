[project]
name = "edhpower"
version = "0.3.0"
description = "Commander (EDH) deck power analysis: bracket, combos, curve, goldfish clocks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["requests>=2.31"]

[project.urls]
Repository = "https://github.com/aurelio-amerio/edhpower"

[project.scripts]
edhpower = "edhpower.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edhpower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
