# Cards whose mana behaviour is neither a tag nor a simple "Add N". Kept deliberately small; every
# card that hits this table is listed in the report. `kind` ∈ land | rock | doubler | untap.
# `mana`: the number the model uses (lands: mana class 0/1/2; rocks: mana per activation).
# Other keys are passed through as `params` for the simulator (Plan C): untap_cost, tron, scales_with,
# reduces, reduces_scope, tutor_cost, requires, scope, sacrifice_on_land_drop.
# `effects` (optional; an entry may carry effects and no `kind`): board effects for the simulator, taking
# precedence over the card's Forge script. Each is a table with `on` ∈ landfall | etb | creature_etb |
# token_created | static | cast | activated | upkeep | land_sacrificed, `do` ∈ token | counters | anthem | pump |
# mana | drain | mill | dredge | extra_land | play_lands_from_graveyard | return_lands | return_lands_to_hand |
# fetch | sacrifice_land | chain_lands_from_hand, and optional n (integer, "lands", or "all" with return_lands),
# power, toughness, type ("lands" with dredge: land cards in your graveyard have dredge n), each_opponent,
# when ("distinct_lands >= N" | "lands >= N" | "tokens >= N"), upgrade (a nested effect used when its `when`
# holds) and cost (an activation or additional cost in Forge spelling, e.g. "3 G Sac<1/CARDNAME>"), e.g.
#   effects = [{ on = "landfall", do = "token", power = 1, toughness = 1, type = "Goat" }]
version = 2

[cards."Ancient Tomb"]
kind = "land"
mana = 2
note = "2-mana land; the extractor reads {C}{C} correctly, listed so the class is explicit"

[cards."Eldrazi Temple"]
kind = "land"
mana = 2
note = "2 mana for colourless Eldrazi only; modelled as 2 (spec)"

[cards."City of Traitors"]
kind = "land"
mana = 2
sacrifice_on_land_drop = true
note = "2-mana land sacrificed when the next land is played; the simulator applies the sacrifice"

[cards."Eye of Ugin"]
kind = "land"
mana = 0
reduces = 2
reduces_scope = "colorless eldrazi spells you cast"
tutor_cost = 7
note = "non-producing; −2 reducer for colourless Eldrazi plus a 7-mana tutor"

[cards."Gaea's Cradle"]
kind = "land"
mana = 0
scales_with = "creatures"
note = "board-dependent; counted as a non-producing land by the closed-form numbers"

[cards."Urza's Mine"]
kind = "land"
mana = 1
tron = 2

[cards."Urza's Power Plant"]
kind = "land"
mana = 1
tron = 2

[cards."Urza's Tower"]
kind = "land"
mana = 1
tron = 3

[cards."Urza's Workshop"]
kind = "land"
mana = 1
scales_with = "urza_lands"

[cards."Forsaken Monument"]
kind = "doubler"
mana = 0
scope = "colorless"
note = "+{C} whenever a permanent is tapped for {C}; Plan C models the doubling"

[cards."Basalt Monolith"]
kind = "rock"
mana = 3
untap_cost = 3

[cards."Mana Vault"]
kind = "rock"
mana = 3
untap_cost = 4

[cards."Grim Monolith"]
kind = "rock"
mana = 3
untap_cost = 3

[cards."Mox Opal"]
