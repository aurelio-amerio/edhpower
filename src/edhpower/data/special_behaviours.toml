mana = 1
requires = "metalcraft"

[cards."Unwinding Clock"]
kind = "untap"
mana = 0
scope = "artifacts"

[cards."Seedborn Muse"]
kind = "untap"
mana = 0
scope = "permanents"

[cards."Manifold Key"]
kind = "untap"
mana = 0
